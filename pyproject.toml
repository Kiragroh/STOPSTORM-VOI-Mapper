[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopstorm-voi-mapper"
version = "0.2.0"
description = "Local LLM-assisted VOI name proposals with one-to-one assignment checks and human review"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[project.scripts]
voi-mapper = "voi_mapper.__main__:main"

[tool.setuptools.package-data]
voi_mapper = ["prompt.txt", "vocabulary.json"]

[tool.setuptools.packages.find]
include = ["voi_mapper*"]
